<!DOCTYPE html>
<html>
<head>
    <title>HR Portal - Login</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container login-card">
        <h2>HR Portal Login</h2>
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" autocomplete="off" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" autocomplete="new-password" required>
            </div>
            <button type="submit" id="loginBtn">Login</button>
        </form>
        <p id="errorMsg" style="color:red; margin-top: 1rem;"></p>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');

        // Clear input values whenever page is loaded/restored from back navigation
        window.addEventListener('pageshow', () => {
            loginForm.reset();
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (res.ok) {
                localStorage.setItem('hr_authenticated', 'true');
                window.location.href = '/dashboard.html';
            } else {
                document.getElementById('errorMsg').innerText = 'Invalid username or password';
            }
        });
    </script>
</body>
</html>
