<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Portal - Employee Directory</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="navbar">
        <h2>HR Directory</h2>
        <div>
            <a href="/reports.html">Reports</a>
            <a href="/candidate.html" target="_blank" id="candidatePortfolioLink">Candidate Portfolio</a>
            <a href="/login.html" onclick="localStorage.removeItem('hr_authenticated')">Logout</a>
        </div>
    </div>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>Employee Directory</h3>
            <button id="openAddModalBtn" onclick="toggleModal(true)">+ Add Employee</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- Add Employee Modal Popup -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <h3>Add New Employee</h3>
            <form id="addEmpForm">
                <div class="form-group">
                    <label for="empName">Full Name:</label>
                    <input type="text" id="empName" required>
                </div>
                <div class="form-group">
                    <label for="empDept">Department:</label>
                    <input type="text" id="empDept" required>
                </div>
                <div class="form-group">
                    <label for="empRole">Role:</label>
                    <input type="text" id="empRole" required>
                </div>
                <div class="form-group">
                    <label for="empSalary">Salary ($):</label>
                    <input type="number" id="empSalary" required>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 1rem;">
                    <button type="submit">Save</button>
                    <button type="button" class="btn-danger" onclick="toggleModal(false)">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Shows/hides modal and resets form inputs on close
        function toggleModal(show) {
            const modal = document.getElementById('addModal');
            modal.style.display = show ? 'flex' : 'none';

            if (!show) {
                document.getElementById('addEmpForm').reset();
            }
        }

        // Fetches all employees and populates table
        async function loadEmployees() {
            try {
                const res = await fetch('/api/employees');
                if (!res.ok) {
                    const errorText = await res.text().catch(() => 'No response body');
                    console.error(`Failed to load employees (Status ${res.status}):`, errorText);
                    return;
                }

                const employees = await res.json();
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';

                employees.forEach(emp => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${emp.id}</td>
                        <td>${emp.name}</td>
                        <td>${emp.department}</td>
                        <td>${emp.role}</td>
                        <td>
                            <button class="btn-danger" onclick="deleteEmp(${emp.id}, '${emp.name}')">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error('Network or parsing error in loadEmployees:', err);
            }
        }

        // Submits new employee data to backend API
        document.getElementById('addEmpForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newEmp = {
                name: document.getElementById('empName').value,
                department: document.getElementById('empDept').value,
                role: document.getElementById('empRole').value,
                salary: document.getElementById('empSalary').value
            };

            try {
                const res = await fetch('/api/employees', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newEmp)
                });

                if (res.ok) {
                    toggleModal(false); // Closes modal and resets form inputs
                    loadEmployees();    // Refreshes the directory list
                } else {
                    const errData = await res.json().catch(() => ({}));
                    alert(`Error saving employee: ${errData.error || 'Server error ' + res.status}`);
                }
            } catch (err) {
                alert('Failed to connect to backend server. Ensure node server.js is running.');
            }
        });

        // Deletes an employee after user confirmation
        async function deleteEmp(id, name) {
            if (confirm(`Are you sure you want to terminate ${name}?`)) {
                try {
                    const res = await fetch(`/api/employees/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        loadEmployees();
                    } else {
                        alert('Failed to delete employee.');
                    }
                } catch (err) {
                    alert('Error connecting to backend server.');
                }
            }
        }

        // Initial fetch on page load
        loadEmployees();
    </script>
</body>
</html>
